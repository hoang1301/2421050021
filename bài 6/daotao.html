<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công thông tin Đào tạo đại học mỏ địa chất</title>
    <style>
        body{
            margin: 0;
        }
        .muc{
            margin: 0;
        }
        .danh-sach-muc{
            margin: 0;
            padding: 0;
       }
       .lien-ket{
        color: white;
        /* bo gach chan the a */
        text-decoration: none;
       }
       

        .danh-muc{
            display: flex;
            background-color:#1f89e5;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 20px;
        }
        .trai{
            width: 20%;
            height: 1000px;
            border-right:2px solid #1f89e5 ;
        }
        .phai{
            width: 80%;
            
        }
        .main{
            display: flex;
        }
        .khoi-dang-nhap{
            
            width: 100%;
            height: 500px;
        }
        form{
            width: 80%;
            margin:  auto;
        }
        input{
            width: 100%;
            padding:5px ;
            
        }
        .quen-mat-khau{
            display: flex;
            justify-content: flex-end;
        }
        .quen-mk{
            text-decoration: none;
            color: #1f89e5;
            
        }
       
        .tin{
            width: 95%;
            height: 100px;
            margin: 30px auto;
            border: 1px solid #1f89e5; 
            border-radius: 10px;
        }
    </style>
    
</head>
<body>
    <!-- danh  muc-->
    <nav class="danh-sach-muc">
        <ul class="danh-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập,Đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục Một cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một cửa online</a></li>
            <li class="muc"><a href="#" class="lien-ket">E-mail HUMG</a></li>
        </ul>
    </nav>
    <main class="main">
        <div class="trai">
            <div class="khoi-dang-nhap">
                <form>
                    <p>Tài khoản</p>
                    <input type="text" >
                    <p>Mật khẩu</p>
                    <input type="password">
                    <div class="quen-mat-khau">
                        <a href="#" class="quen-mk"><p>Quên mật khẩu</p></a>
                    </div>
                    <button>Đăng nhập</button><br>
                    <button>Đăng nhập với microsoft</button>
                </form>
            </div>
            
        </div>
        <div class="phai">
             <div class="danh-sach-tin">
                <div class="tin">
                    <div class="chuc-nang">
                        <div class="tieu-de">Tin tức</div>
                        <div class="xem-tiep"><a class="lien-ket-xem-tiep"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
