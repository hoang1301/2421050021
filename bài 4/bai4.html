<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 4</title>
</head>
<body>
    <form>
        <b>username:</b><br>
        <input type="text" name="username" placeholder="nhap tt">
        <!-- type k nhap gi mat dinh la text -->
         <br>
         <br>
         <b>thong tin:</b><br>
         <textarea id="text"></textarea>
         <br>
         <b>email:</b><br>
         <input type="email" id="email" required><br>

         <br>
         <input type="radio" name="gender">
         <label >nam</label>
         <br>
         <input type="radio" name="gender">nu
         <br>
         <b>sdt:</b><br>
         <input type="tel" required pattern="84(-[0-9]{3})(-[0-9]{3})(-[0-9]{3})">
         <br>
         <input type="submit">
         <br>
         <input type="checkbox" name="hobby" value="game">game
         <br>
         <input type="checkbox" name="hobby" value="book">book
         <br>
         <input type="checkbox" name="hobby" value="book">sing
         <br>
         <b>nam sinh:</b><br>
         <input list="nam_sinh">
         <datalist id="nam_sinh">
            <option value="2004"></option>
            <option value="2005"></option>
            <option value="2006"></option>
            <option value="2007"></option>

         </datalist>
         <br>
         <select id="nam">
            <option value="title"> nam sinh</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2006">2006</option>
            <option value="2007">2007</option>
         </select>
         <br>
         <input type="range">
         <button>submit</button>
         <input type="reset">
         <br>
         <iframe width="560" height="315" src="https://www.youtube.com/embed/v6xlnV0CwTA?si=jqferDDiP8yaiP1W" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
         <br>
         <audio src="audio.mp3" controls></audio>
    </form>
</body>
</html>
