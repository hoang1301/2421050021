<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        
        document.writeln("hello world <br>")
        var bien="Qa"
        document.writeln(bien+"<br>")
        bien="LY"
        document.writeln(bien+"<br>")
        var num=2006
        document.writeln(num+"<br>")
        //cong
        var num_hai=2
        var kq=num_hai+num
        document.writeln(kq+"<br>")
        //tru
        kq=num-num_hai
        document.writeln(kq+"<br>")
        // document.writeln(++num+"<br >")
        num+=num_hai
        document.writeln(num+"<br>")
         num-=num_hai
        document.writeln(num+"<br>")
        var ho="DO"
        document.writeln(ho+" "+bien)
        document.write(bien.length+"<br>")
        var bien="NGUYEN CONG HOANG"
        document.writeln(bien.indexOf("NGUYEN"))
        document.writeln(bien.includes("HOANG")+"<br>")
        document.writeln(bien.startsWith("NGUYEN")+"<br>")
        document.writeln(bien.replace("NGUYEN","DO")+"<br>")
        document.writeln(bien.toLowerCase())
        
    </script>
    <script src="java.js"></script>
</body>
</html>
